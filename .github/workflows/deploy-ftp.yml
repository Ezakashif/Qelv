name: Deploy via FTP/FTPS

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      host name only, e.g. ftp.example.com (never commit the build host)
#   FTP_USERNAME
#   FTP_PASSWORD
# Optional:
#   FTP_SERVER_DIR  remote directory, must end with "/" (default: ./)
#   FTP_PROTOCOL    ftp | ftps (default: ftps)
# If FTP_SERVER is not set, the deploy job is skipped and the workflow still passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Report missing configuration
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP_SERVER secret not set - skipping FTP deploy."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FTP == 'true'
        with:
          node-version: 22
          cache: npm

      - if: env.HAS_FTP == 'true'
        run: npm ci && npm test && npm run build

      - name: Upload dist/
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
